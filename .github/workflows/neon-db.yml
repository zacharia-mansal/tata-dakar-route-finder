name: Neon database validation

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

concurrency:
  group: neon-db-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: App and domain checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run domain tests
        run: pnpm --filter @tata/domain test

      - name: Run repository script tests
        run: pnpm exec vitest run scripts

      - name: Typecheck domain
        run: pnpm --filter @tata/domain typecheck

      - name: Scan app files for server credentials
        run: pnpm check:app-secrets

  neon-db-fork:
    name: Neon validation NOT EXECUTED for fork pull requests
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Mark Neon validation as not executed
        run: echo 'Neon branch validation is NOT EXECUTED for fork pull requests because GitHub environment secrets are unavailable to fork workflows.'

  neon-db:
    name: Neon migrations, seeds, rollback, and pgTAP
    needs: app-checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment: neon-validation
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install database validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client perl cpanminus
          sudo cpanm --notest TAP::Parser::SourceHandler::pgTAP
          npm install --global dbmate@2.37.0

      - name: Check Neon secrets are configured
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          if [[ -z "$NEON_API_KEY" || -z "$NEON_PROJECT_ID" ]]; then
            echo 'Configure NEON_API_KEY and NEON_PROJECT_ID in the neon-validation environment secrets.' >&2
            exit 1
          fi

      - name: Create temporary Neon schema branch
        id: neon
        uses: neondatabase/create-branch-action@153375631fc0f99cf0113e0cef877850452e6ca2 # v6.0.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: tata-ci-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          branch_type: schema-only
          ssl: require

      - name: Mask generated Neon connection URL (direct)
        shell: bash
        env:
          NEON_DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          set +x
          printf '::add-mask::%s\n' "$NEON_DATABASE_URL"

      - name: Check Neon migration status
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm db:status

      - name: Apply migrations, seeds, and pgTAP tests
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm db:validate

      - name: Roll back temporary branch and validate reapplication
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          pnpm db:rollback
          pnpm db:validate

      - name: Delete temporary Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        continue-on-error: ${{ job.status == 'failure' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        run: |
          set +x
          node --input-type=module <<'NODE'
          const { NEON_API_KEY: apiKey, NEON_PROJECT_ID: projectId, NEON_BRANCH_ID: branchId } = process.env;
          if (!branchId) process.exit(0);
          if (!apiKey || !projectId) {
            console.error('Neon temporary branch cleanup could not run because required environment variables are missing.');
            process.exit(1);
          }

          const url = `https://console.neon.tech/api/v2/projects/${encodeURIComponent(projectId)}/branches/${encodeURIComponent(branchId)}`;
          let response;
          try {
            response = await fetch(url, {
              method: 'DELETE',
              headers: {
                accept: 'application/json',
                authorization: `Bearer ${apiKey}`,
              },
              signal: AbortSignal.timeout(20000),
            });
          } catch {
            console.error('Neon temporary branch cleanup request failed before receiving a response.');
            process.exit(1);
          }

          if (response.status !== 200) {
            console.error(`Neon temporary branch cleanup failed with HTTP status ${response.status}.`);
            process.exit(1);
          }
          NODE

  workspace-validation:
    name: Full workspace validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspaces
        run: pnpm -r typecheck

      - name: Typecheck repository scripts
        run: pnpm typecheck

      - name: Run all tests
        run: pnpm exec vitest run

      - name: Scan app files for server credentials
        run: pnpm check:app-secrets
